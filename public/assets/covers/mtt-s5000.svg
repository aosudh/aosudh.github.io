    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" fill="#5eead4" font-family="Consolas,monospace" font-size="9" font-weight="700">MT2</text>
  </g>

  <text x="28" y="246" fill="#f8fafc" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="25" font-weight="700">MTT S5000 单卡与八卡实测</text>
  <text x="28" y="274" fill="#94a3b8" font-family="Consolas,monospace" font-size="13">FP8 · Torch Flash · MTLink 全互联 · MCCL</text>
