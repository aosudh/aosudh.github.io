<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="NVIDIA GPU PCI Device ID 全量对照封面图">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11101d"/>
      <stop offset="100%" stop-color="#1c1930"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#a78bfa" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="300" fill="url(#g)"/>
  <rect width="480" height="300" fill="url(#grid)"/>
  <circle cx="400" cy="60" r="135" fill="#8b5cf6" opacity="0.14"/>

  <rect x="28" y="24" width="144" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-opacity="0.5"/>
  <text x="40" y="42" fill="#ddd6fe" font-family="Consolas,monospace" font-size="13" font-weight="700">PCI ID DATABASE</text>
  <text x="452" y="42" text-anchor="end" fill="#94a3b8" font-family="Consolas,monospace" font-size="12">354 ENTRIES</text>

  <!-- Pseudo table -->
  <rect x="28" y="66" width="424" height="128" rx="10" fill="#151326" stroke="#4c1d95" stroke-opacity="0.7" stroke-width="1.4"/>
  <rect x="28" y="66" width="424" height="28" rx="10" fill="#2e1065" fill-opacity="0.55"/>
  <g font-family="Consolas,monospace" font-size="12">
    <text x="44" y="85" fill="#c4b5fd" font-weight="700">DEVICE ID</text>
    <text x="164" y="85" fill="#c4b5fd" font-weight="700">CHIP</text>
    <text x="260" y="85" fill="#c4b5fd" font-weight="700">ARCH / CC</text>
    <text x="436" y="85" text-anchor="end" fill="#c4b5fd" font-weight="700">SKU</text>

    <text x="44" y="114" fill="#38bdf8" font-weight="700">10DE:2330</text>
    <text x="164" y="114" fill="#e2e8f0">GH100</text>
    <text x="260" y="114" fill="#94a3b8">Hopper · 9.0</text>
    <text x="436" y="114" text-anchor="end" fill="#a78bfa">H100 SXM</text>

    <line x1="40" y1="126" x2="440" y2="126" stroke="#312e81" stroke-opacity="0.7"/>
    <text x="44" y="146" fill="#38bdf8" font-weight="700">10DE:2901</text>
    <text x="164" y="146" fill="#e2e8f0">GB100</text>
    <text x="260" y="146" fill="#94a3b8">Blackwell · 10.0</text>
    <text x="436" y="146" text-anchor="end" fill="#a78bfa">B200</text>

    <line x1="40" y1="158" x2="440" y2="158" stroke="#312e81" stroke-opacity="0.7"/>
    <text x="44" y="178" fill="#34d399" font-weight="700">10DE:3041</text>
    <text x="164" y="178" fill="#e2e8f0">GR100</text>
    <text x="260" y="178" fill="#94a3b8">Rubin · 10.7</text>
    <text x="436" y="178" text-anchor="end" fill="#34d399">VR NVL72</text>
  </g>

  <text x="28" y="246" fill="#f8fafc" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="24" font-weight="700">NVIDIA PCI ID 全量对照</text>
  <text x="28" y="274" fill="#94a3b8" font-family="Consolas,monospace" font-size="13">Ampere → Ada → Hopper → Blackwell → Rubin</text>
</svg>
