<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="NVIDIA PCI Device ID 全量对照封面图">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11101d"/>
      <stop offset="100%" stop-color="#1c1930"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#a78bfa" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="300" fill="url(#g)"/>
  <rect width="480" height="300" fill="url(#grid)"/>
  <circle cx="400" cy="60" r="135" fill="#8b5cf6" opacity="0.14"/>

  <rect x="28" y="22" width="150" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-opacity="0.5"/>
  <text x="40" y="40" fill="#ddd6fe" font-family="Consolas,monospace" font-size="13" font-weight="700">PCI ID DATABASE</text>
  <text x="452" y="40" text-anchor="end" fill="#34d399" font-family="Consolas,monospace" font-size="12" font-weight="700">1149 ENTRIES</text>

  <!-- Pseudo table -->
  <rect x="28" y="62" width="424" height="146" rx="10" fill="#151326" stroke="#4c1d95" stroke-opacity="0.7" stroke-width="1.4"/>
  <rect x="28" y="62" width="424" height="26" rx="10" fill="#2e1065" fill-opacity="0.55"/>
  <g font-family="Consolas,monospace" font-size="11.5">
    <text x="42" y="80" fill="#c4b5fd" font-weight="700">VID:DID</text>
    <text x="150" y="80" fill="#c4b5fd" font-weight="700">CHIP</text>
    <text x="236" y="80" fill="#c4b5fd" font-weight="700">ARCH / ROLE</text>
    <text x="438" y="80" text-anchor="end" fill="#c4b5fd" font-weight="700">SKU</text>

    <text x="42" y="108" fill="#34d399" font-weight="700">10DE:3041</text>
    <text x="150" y="108" fill="#e2e8f0">GR100</text>
    <text x="236" y="108" fill="#94a3b8">Rubin · sm_107</text>
    <text x="438" y="108" text-anchor="end" fill="#34d399">VR NVL72</text>

    <line x1="40" y1="118" x2="440" y2="118" stroke="#312e81" stroke-opacity="0.7"/>
    <text x="42" y="136" fill="#38bdf8" font-weight="700">10DE:31C2</text>
    <text x="150" y="136" fill="#e2e8f0">GB110</text>
    <text x="236" y="136" fill="#94a3b8">Blackwell · 10.3</text>
    <text x="438" y="136" text-anchor="end" fill="#a78bfa">GB300 NVL</text>

    <line x1="40" y1="146" x2="440" y2="146" stroke="#312e81" stroke-opacity="0.7"/>
    <text x="42" y="164" fill="#fbbf24" font-weight="700">10DE:2F95</text>
    <text x="150" y="164" fill="#e2e8f0">TB500</text>
    <text x="236" y="164" fill="#94a3b8">Vera CPU · RP</text>
    <text x="438" y="164" text-anchor="end" fill="#fbbf24">PCIe x16</text>

    <line x1="40" y1="174" x2="440" y2="174" stroke="#312e81" stroke-opacity="0.7"/>
    <text x="42" y="192" fill="#f472b6" font-weight="700">15B3:D2F8</text>
    <text x="150" y="192" fill="#e2e8f0">NVL-6</text>
    <text x="236" y="192" fill="#94a3b8">NVLink Switch</text>
    <text x="438" y="192" text-anchor="end" fill="#f472b6">Gen6 Fabric</text>
  </g>

  <text x="28" y="250" fill="#f8fafc" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700">NVIDIA GPU PCI Device ID</text>
  <text x="28" y="276" fill="#94a3b8" font-family="Consolas,monospace" font-size="12.5">Rubin / Blackwell · Vera / Grace · NVSwitch</text>
