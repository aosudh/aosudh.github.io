<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="SN2100 Onyx 故障恢复封面图">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="100%" stop-color="#132234"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="300" fill="url(#g)"/>
  <rect width="480" height="300" fill="url(#grid)"/>
  <circle cx="410" cy="40" r="130" fill="#14b8a6" opacity="0.12"/>

  <!-- Top badge -->
  <rect x="28" y="24" width="136" height="26" rx="6" fill="#14b8a6" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.4"/>
  <text x="40" y="42" fill="#5eead4" font-family="Consolas,monospace" font-size="13" font-weight="700">SWITCH RECOVERY</text>
  <text x="452" y="42" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="12">16 × 100GbE</text>

  <!-- Switch faceplate graphic -->
  <rect x="28" y="68" width="424" height="82" rx="10" fill="#0f1b2d" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="90" fill="#94a3b8" font-family="Consolas,monospace" font-size="11">MELLANOX SN2100 · QSFP28</text>
  <!-- Status LEDs -->
  <circle cx="410" cy="86" r="4" fill="#22c55e"/>
  <circle cx="424" cy="86" r="4" fill="#14b8a6"/>
  <circle cx="438" cy="86" r="4" fill="#f59e0b"/>
  <!-- 8 QSFP cages -->
  <g fill="#1e293b" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.2">
    <rect x="44" y="102" width="38" height="32" rx="4"/>
    <rect x="92" y="102" width="38" height="32" rx="4"/>
    <rect x="140" y="102" width="38" height="32" rx="4"/>
    <rect x="188" y="102" width="38" height="32" rx="4"/>
    <rect x="252" y="102" width="38" height="32" rx="4"/>
    <rect x="300" y="102" width="38" height="32" rx="4"/>
    <rect x="348" y="102" width="38" height="32" rx="4"/>
    <rect x="396" y="102" width="38" height="32" rx="4"/>
  </g>
  <g fill="#2dd4bf" opacity="0.25">
    <rect x="50" y="110" width="26" height="16" rx="2"/>
    <rect x="98" y="110" width="26" height="16" rx="2"/>
    <rect x="258" y="110" width="26" height="16" rx="2"/>
    <rect x="306" y="110" width="26" height="16" rx="2"/>
  </g>

  <!-- Recovery pipeline -->
  <g font-family="Consolas,monospace" font-size="13" font-weight="700">
    <rect x="28" y="170" width="112" height="34" rx="7" fill="#1e293b" stroke="#475569"/>
    <text x="84" y="192" text-anchor="middle" fill="#e2e8f0">1. SERIAL</text>
    <path d="M148 187 H176" stroke="#2dd4bf" stroke-width="2.2"/>
    <polygon points="174,182 183,187 174,192" fill="#2dd4bf"/>

    <rect x="186" y="170" width="112" height="34" rx="7" fill="#134e4a" stroke="#2dd4bf"/>
    <text x="242" y="192" text-anchor="middle" fill="#ccfbf1">2. ONIE</text>
    <path d="M306 187 H334" stroke="#2dd4bf" stroke-width="2.2"/>
    <polygon points="332,182 341,187 332,192" fill="#2dd4bf"/>

    <rect x="344" y="170" width="108" height="34" rx="7" fill="#0f766e" stroke="#5eead4"/>
    <text x="398" y="192" text-anchor="middle" fill="#ffffff">3. ONYX</text>
  </g>

  <!-- Title footer -->
  <text x="28" y="246" fill="#f8fafc" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="25" font-weight="700">SN2100 串口救援与重装</text>
  <text x="28" y="274" fill="#94a3b8" font-family="Consolas,monospace" font-size="13">GRUB rescue · Onyx 3.9.3202 · DAC 1036</text>
</svg>
